# mavlink-routerd configuration for a Raspberry Pi 5 that is connected to a
# UVify V6X flight controller (ArduPilot) by UART.
#
# FC UART2 connector (ArduPilot SERIAL3, MAVLink2, 921600 baud) <-> Pi 5 UART0
# (GPIO14/15, RTS/CTS on GPIO17/16) = /dev/ttyAMA0. See
# docs/fc-v6x-rpi5-uart-wiring.md. mavlink-routerd owns the port and forwards each
# message to the UDP endpoints below. Thus several programs can use the FC
# link at the same time.

[General]
# TCP server for QGroundControl or MAVProxy. A client that can reach this port
# can command the FC. 0 disables the server. Set e.g. 5760 to enable it.
TcpServerPort = 0
ReportStats = false

[UartEndpoint fc]
Device = /dev/ttyAMA0
Baud = 921600
# true only when the RTS and CTS wires are connected (FC pins 4 and 5).
FlowControl = true

# xeye bridge (MAVSDK connection url udpin://0.0.0.0:14600).
[UdpEndpoint xeye_bridge]
Mode = Normal
Address = 127.0.0.1
Port = 14600

# capturelib imu_mavlink (udp: 127.0.0.1:14601). The granite and openvio live
# programs read the IMU and send ODOMETRY on this endpoint too. Only one
# program at a time can use it.
[UdpEndpoint xeye_imu]
Mode = Normal
Address = 127.0.0.1
Port = 14601

# Ground stations on the network (QGroundControl, Mission Planner): they send
# to <pi-ip>:14550 and the router answers the last sender. A client that can
# reach this port can command the FC. Remove this section on an untrusted
# network.
[UdpEndpoint gcs]
Mode = Server
Address = 0.0.0.0
Port = 14550
